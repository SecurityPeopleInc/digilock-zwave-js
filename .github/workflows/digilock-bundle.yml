name: Digilock bundle

on:
  workflow_dispatch:

env:
  TURBO_API: "http://127.0.0.1:9080"
  TURBO_TOKEN: foo
  TURBO_TEAM: me
  TURBO_FLAGS: ""

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare testing environment
        uses: ./.github/actions/prepare-env
        with:
          node-version: "22"
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: yarn build $TURBO_FLAGS

      - name: Create Digilock bundle
        run: |
          cd Digilock
          yarn bundle

      - name: Remove store from dist (cache/config created at runtime)
        run: rm -rf Digilock/dist/store

      - name: Add serialport to dist (only node_modules, no package.json/package-lock.json)
        run: |
          DIST="${{ github.workspace }}/Digilock/dist"
          mkdir -p /tmp/digilock-npm
          cd /tmp/digilock-npm
          npm init -y
          npm install serialport --omit=dev
          cp -r node_modules "$DIST/"

      - name: Trim node_modules (minimal runtime, Linux x64 only)
        run: |
          DIST="${{ github.workspace }}/Digilock/dist/node_modules"
          # Remove test mock (not used at runtime)
          rm -rf "$DIST/@serialport/binding-mock"
          # Keep only Linux x64 prebuild (artifact targets ubuntu/linux x64)
          PREBUILDS="$DIST/@serialport/bindings-cpp/prebuilds"
          for d in "$PREBUILDS"/*/; do
            [ "$(basename "$d")" = "linux-x64" ] || rm -rf "$d"
          done
          # Remove C++ source and build files from bindings-cpp (prebuilds are enough)
          rm -rf "$DIST/@serialport/bindings-cpp/src" "$DIST/@serialport/bindings-cpp/tools"
          rm -f "$DIST/@serialport/bindings-cpp"/*.gypi "$DIST/@serialport/bindings-cpp"/*.gyp "$DIST/@serialport/bindings-cpp"/*.c "$DIST/@serialport/bindings-cpp"/*.h 2>/dev/null || true

      - name: Upload Digilock bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: digilock-bundle
          path: Digilock/dist/
          retention-days: 30

      - name: Add run instructions to summary
        run: |
          echo "## How to run the Digilock bundle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Download the artifact** from this run (Actions tab → this workflow run → Artifacts → \`digilock-bundle\`)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **Extract** the zip. You get \`dist/\` with \`digilock-bundle.js\`, \`public/\`, and a trimmed \`node_modules/\` (serialport, Linux x64 only). No package.json or package-lock.json. Cache and device-config dirs are created at runtime (use \`ZWAVE_CACHE_DIR\`). **Artifact is built for Linux x64**; on other OS/arch install serialport locally." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3. **Set required environment variables** (six security keys + serial port):" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   export ZWAVE_S0_LEGACY_KEY=\"...\"           # 32 hex chars" >> $GITHUB_STEP_SUMMARY
          echo "   export ZWAVE_S2_ACCESS_CONTROL_KEY=\"...\"" >> $GITHUB_STEP_SUMMARY
          echo "   export ZWAVE_S2_AUTHENTICATED_KEY=\"...\"" >> $GITHUB_STEP_SUMMARY
          echo "   export ZWAVE_S2_UNAUTHENTICATED_KEY=\"...\"" >> $GITHUB_STEP_SUMMARY
          echo "   export ZWAVE_S2_ACCESS_CONTROL_KEY_LR=\"...\"" >> $GITHUB_STEP_SUMMARY
          echo "   export ZWAVE_S2_AUTHENTICATED_KEY_LR=\"...\"" >> $GITHUB_STEP_SUMMARY
          echo "   export ZWAVE_PORT=\"/dev/serial/by-id/usb-XXXX_YYYY-if00\"   # required" >> $GITHUB_STEP_SUMMARY
          echo "   export PORT=3005                            # optional, server port" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "4. **Run** (from inside \`dist/\`):" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   node digilock-bundle.js" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Kotlin/ProcessBuilder:** Set \`command\` to \`/usr/bin/node\` and the path to \`digilock-bundle.js\`. Put all seven env vars (six security keys + \`ZWAVE_PORT\`) in \`ProcessBuilder.environment()\`. No \`--serial-port\` argument; port is from \`ZWAVE_PORT\` only." >> $GITHUB_STEP_SUMMARY
